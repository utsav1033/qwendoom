<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="960" height="430" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2328">Making it fast: one day on a MacBook CPU</text>
  <text x="480" y="60" text-anchor="middle" font-size="14" fill="#57606a">tokens per second (log scale), and how long the model then takes to reach Doom's first frame</text>

  <!-- axis: x = 330 + 280 * log10(v / 50) -->
  <g stroke="#eaeef2">
    <line x1="330" y1="80" x2="330" y2="380"/>
    <line x1="610" y1="80" x2="610" y2="380"/>
    <line x1="890" y1="80" x2="890" y2="380"/>
  </g>
  <g font-size="12" fill="#8c959f" text-anchor="middle">
    <text x="330" y="398">50</text>
    <text x="610" y="398">500</text>
    <text x="890" y="398">5,000 tokens/s</text>
  </g>

  <g font-size="13.5" fill="#1f2328">
    <text x="20" y="104" font-weight="700">The Doom model's first run</text>
    <text x="20" y="121" fill="#57606a" font-size="12">skip zero weights, transformers' rounding</text>
    <rect x="330" y="93" width="56" height="26" rx="4" fill="#8c959f"/>
    <text x="394" y="111">79 · 9.3 days</text>

    <text x="20" y="154" font-weight="700">Tidier sparse math</text>
    <text x="20" y="171" fill="#57606a" font-size="12">runs of rows, cached sums, SiLU shortcut</text>
    <rect x="330" y="143" width="118" height="26" rx="4" fill="#8c959f"/>
    <text x="456" y="161">132 · 5.5 days</text>

    <text x="20" y="204" font-weight="700">Less memory traffic</text>
    <text x="20" y="221" fill="#57606a" font-size="12">4 threads, 16-bit weights, only used conv taps</text>
    <rect x="330" y="193" width="203" height="26" rx="4" fill="#8c959f"/>
    <text x="541" y="211">265 · 2.8 days</text>

    <text x="20" y="254" font-weight="700">Skip memory rows that can't match</text>
    <text x="20" y="271" fill="#57606a" font-size="12">proved per head, before computing</text>
    <rect x="330" y="243" width="337" height="26" rx="4" fill="#d4a72c"/>
    <text x="675" y="261">797 · 22 hours</text>

    <text x="20" y="304" font-weight="700">Skip whole dead layers, prune the vocab</text>
    <text x="20" y="321" fill="#57606a" font-size="12">250 of 328 layers skipped per token</text>
    <rect x="330" y="293" width="446" height="26" rx="4" fill="#d4a72c"/>
    <text x="784" y="311">1,960 · 9 hours</text>

    <text x="20" y="354" font-weight="700">Sharper vocab pruning</text>
    <text x="20" y="371" fill="#57606a" font-size="12">one best score for all 230k tokens</text>
    <rect x="330" y="343" width="523" height="26" rx="4" fill="#bf8700"/>
    <text x="704" y="361" fill="#ffffff" font-weight="700">3,700 · 4.8 hours</text>
  </g>
  <text x="480" y="420" text-anchor="middle" font-size="12" fill="#57606a">Every step gives the same tokens as the step before it, checked against the reference CPU.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="960" height="400" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2328">The memory mod: 32 KB → 4 MB of RAM</text>
  <text x="480" y="60" text-anchor="middle" font-size="14" fill="#57606a">each square is 32 KB, all of stock Qwenputer's RAM</text>

  <!-- stock -->
  <text x="40" y="104" font-size="15" font-weight="700" fill="#1f2328">Stock Qwenputer</text>
  <rect x="40" y="118" width="22" height="22" fill="#8c959f"/>
  <text x="72" y="135" font-size="13" fill="#57606a">32 KB</text>
  <text x="40" y="172" font-size="13" fill="#57606a">enough for small programs.</text>
  <text x="40" y="190" font-size="13" fill="#57606a">Doom's screen alone is 64 KB,</text>
  <text x="40" y="208" font-size="13" fill="#57606a">its heap needs ~2.3 MB.</text>
  <text x="40" y="250" font-size="15" font-weight="700" fill="#1f2328">11 layers</text>
  <rect x="40" y="262" width="19.2" height="96" fill="url(#gbars)"/>
  <text x="68" y="314" font-size="12.5" fill="#57606a">(same scale)</text>

  <!-- mod -->
  <text x="330" y="104" font-size="15" font-weight="700" fill="#1f2328">qwendoom</text>
  <g fill="#d4a72c">
    <!-- 128 squares, 32 x 4 -->
    <g id="row">
      <rect x="330" y="118" width="14" height="14"/><rect x="348" y="118" width="14" height="14"/><rect x="366" y="118" width="14" height="14"/><rect x="384" y="118" width="14" height="14"/>
      <rect x="402" y="118" width="14" height="14"/><rect x="420" y="118" width="14" height="14"/><rect x="438" y="118" width="14" height="14"/><rect x="456" y="118" width="14" height="14"/>
      <rect x="474" y="118" width="14" height="14"/><rect x="492" y="118" width="14" height="14"/><rect x="510" y="118" width="14" height="14"/><rect x="528" y="118" width="14" height="14"/>
      <rect x="546" y="118" width="14" height="14"/><rect x="564" y="118" width="14" height="14"/><rect x="582" y="118" width="14" height="14"/><rect x="600" y="118" width="14" height="14"/>
      <rect x="618" y="118" width="14" height="14"/><rect x="636" y="118" width="14" height="14"/><rect x="654" y="118" width="14" height="14"/><rect x="672" y="118" width="14" height="14"/>
      <rect x="690" y="118" width="14" height="14"/><rect x="708" y="118" width="14" height="14"/><rect x="726" y="118" width="14" height="14"/><rect x="744" y="118" width="14" height="14"/>
      <rect x="762" y="118" width="14" height="14"/><rect x="780" y="118" width="14" height="14"/><rect x="798" y="118" width="14" height="14"/><rect x="816" y="118" width="14" height="14"/>
      <rect x="834" y="118" width="14" height="14"/><rect x="852" y="118" width="14" height="14"/><rect x="870" y="118" width="14" height="14"/><rect x="888" y="118" width="14" height="14"/>
    </g>
    <use href="#row" y="18"/>
    <use href="#row" y="36"/>
    <use href="#row" y="54"/>
  </g>
  <text x="330" y="206" font-size="13" fill="#57606a">4 MB of RAM (128×), plus 8 MB of read-only memory for the game data.</text>
  <text x="330" y="224" font-size="13" fill="#57606a">Each layer holds 16 KB, so the compiler spills the new memory into new layers.</text>

  <text x="330" y="250" font-size="15" font-weight="700" fill="#1f2328">328 layers</text>
  <g fill="#d4a72c">
    <rect x="330" y="262" width="572" height="96" fill="url(#bars)"/>
  </g>
  <defs>
    <pattern id="gbars" width="1.744" height="96" patternUnits="userSpaceOnUse" x="40">
      <rect width="1.2" height="96" fill="#8c959f"/>
    </pattern>
    <pattern id="bars" width="1.744" height="96" patternUnits="userSpaceOnUse" x="330">
      <rect width="1.2" height="96" fill="#d4a72c"/>
    </pattern>
  </defs>
  <text x="330" y="380" font-size="12.5" fill="#57606a">256 for RAM · 64 for read-only data · 8 for the CPU itself (decode, ALU, registers, ROM)</text>
</svg>
